name: Roblox update alerts

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roblox-update-alerts
  cancel-in-progress: false

jobs:
  poll:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Roblox and send alerts
        shell: pwsh
        env:
          DISCORD_CHANNEL_ID: "1567254518796648468"
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: ./watch.ps1 -Once
      - name: Save delivered alert state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          file=state-1567254518796648468.json
          if [[ ! -f "$file" ]]; then exit 0; fi
          git add -- "$file"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record Roblox update alert state'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
